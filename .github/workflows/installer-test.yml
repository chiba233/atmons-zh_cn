name: Installer test

# 安装脚本一旦改动，必须在 macOS / Windows / Linux 三台 runner 上
# 跑端到端测试（造假实例 → 应用汉化 → 断言 → 恢复备份 → 断言，
# 含可选拼音 mods 分支）。测试驱动是跨平台的 scripts/test_installer.py：
# Unix 走 install.sh，Windows 走 powershell 5.1 + install.ps1（与用户双击 .bat 一致）。
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/test_installer.py'
      - 'scripts/build_dist.sh'
      - 'scripts/assemble.py'
      - 'scripts/paths.py'
      - '.github/workflows/installer-test.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/test_installer.py'
      - 'scripts/build_dist.sh'
      - 'scripts/assemble.py'
      - 'scripts/paths.py'
      - '.github/workflows/installer-test.yml'
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 安装器会去 GitHub API 查最新版。端到端测试不该依赖外网，也不该每次
    # 三个系统各打一次 API（未认证只有 60 次/小时，撞上限就红得莫名其妙）。
    env:
      ATM_SKIP_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 仓库里没有 config/ kubejs/ 这些出货目录，先从 src/ 摊出来。
      # 安装器测试不碰图片与 lang 生成物，所以不用下整合包。
      - name: 从 src/ 摊出货树
        run: python scripts/assemble.py

      - name: 端到端测试（应用 → 恢复 → 可选mods）
        run: python scripts/test_installer.py
